
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#030910">
<title>JARBAS HUD</title>
<link rel="apple-touch-icon" href="icon%20-%20Jarbas.png">
<link rel="icon" type="image/png" href="icon%20-%20Jarbas.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: radial-gradient(circle, #102b40, #030910 70%);
  color: #65dfff;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 18px;
}

header {
  letter-spacing: 7px;
  font-size: 28px;
}

.subtitle {
  font-size: 10px;
  letter-spacing: 4px;
  color: #d6af65;
  margin-top: 10px;
}

#clock {
  font-size: 48px;
  font-weight: 200;
  margin-top: 30px;
  letter-spacing: 4px;
}

#date {
  font-size: 13px;
  color: #a4c5d5;
  text-transform: uppercase;
}

.hud {
  position: relative;
  width: min(320px, 85vw);
  aspect-ratio: 1;
  margin: 35px auto;
  display: grid;
  place-items: center;
}

.ring {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.r1 {
  inset: 0;
  border: 3px dashed #32cfff;
  animation: spin 25s linear infinite;
  box-shadow: 0 0 20px #00bfff33;
}

.r2 {
  inset: 15px;
  border: 6px solid transparent;
  border-top-color: #d6af65;
  border-bottom-color: #d6af65;
  animation: spin 12s linear infinite reverse;
}

.r3 {
  inset: 35px;
  border: 2px dashed #32cfff;
  animation: spin 18s linear infinite;
}

.r4 {
  inset: 52px;
  border: 1px solid #d6af65;
  box-shadow: 0 0 25px #00bfff44;
}

.core {
  position: relative;
  z-index: 2;
  width: 55%;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid #65dfff;
  background: radial-gradient(circle, #123e55, #04121d);
  color: #65dfff;
  box-shadow: 0 0 35px #00bfff66;
  cursor: pointer;
  animation: pulse 3s infinite;
}

.core strong {
  display: block;
  font-size: 22px;
  letter-spacing: 4px;
}

.core span {
  display: block;
  font-size: 10px;
  margin-top: 10px;
  color: #d6af65;
  letter-spacing: 2px;
}

.status {
  color: #65ffc8;
  font-size: 11px;
  letter-spacing: 3px;
  margin-bottom: 25px;
}

.panels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 500px;
  margin: auto;
}

.panel {
  padding: 20px 8px;
  border: 1px solid #28758d;
  border-radius: 12px;
  background: #071723;
  color: #65dfff;
  text-decoration: none;
}

.panel small {
  display: block;
  color: #d6af65;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.panel strong {
  font-size: 17px;
}

footer {
  margin-top: 35px;
  font-size: 9px;
  letter-spacing: 3px;
  color: #648695;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% { box-shadow: 0 0 55px #00bfff99; }
}

@media (prefers-reduced-motion: reduce) {
  .ring, .core { animation: none; }
}
</style>
</head>

<body>

<header>JARBAS</header>
<div class="subtitle">PERSONAL INTELLIGENCE SYSTEM</div>

<div id="clock">00:00:00</div>
<div id="date"></div>

<div class="hud">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>
  <div class="ring r4"></div>

  <button class="core" onclick="activate()">
    <strong>JARBAS</strong>
    <span>TOQUE PARA FALAR</span>
  </button>
</div>

<div class="status">● SISTEMA OPERACIONAL</div>

<div class="panels">

  <a class="panel"
     href="https://www.google.com/search?q=previsao+do+tempo+Jundiai">
    <small>CLIMA · JUNDIAÍ</small>
    <strong id="weather">Consultando...</strong>
  </a>

  <a class="panel"
     href="https://calendar.google.com/">
    <small>AGENDA</small>
    <strong>Compromissos</strong>
  </a>

  <a class="panel" href="https://chatgpt.com/">
    <small>INTELIGÊNCIA</small>
    <strong>ChatGPT</strong>
  </a>

  <a class="panel" href="https://mail.google.com/">
    <small>COMUNICAÇÃO</small>
    <strong>E-mail</strong>
  </a>

</div>

<footer>JARBAS SYSTEM • VERSION 1.0</footer>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById('clock').textContent =
    now.toLocaleTimeString('pt-BR');

  document.getElementById('date').textContent =
    now.toLocaleDateString('pt-BR', {
      weekday: 'long',
      day: 'numeric',
      month: 'long',
      year: 'numeric'
    });
}

updateClock();
setInterval(updateClock, 1000);

function activate() {
  window.location.href =
    'shortcuts://run-shortcut?name=Jarbas';
}

async function updateWeather() {
  try {
    const response = await fetch(
      'https://api.open-meteo.com/v1/forecast?latitude=-23.19&longitude=-46.88&current=temperature_2m'
    );

    if (!response.ok) throw new Error();

    const data = await response.json();

    document.getElementById('weather').textContent =
      Math.round(data.current.temperature_2m) + ' °C';

  } catch {
    document.getElementById('weather').textContent =
      'Consultar clima';
  }
}

updateWeather();
setInterval(updateWeather, 600000);
</script>

</body>
</html>
